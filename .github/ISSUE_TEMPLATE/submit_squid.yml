name: 🦑 Submit a Squid Save
description: Share your evolved squid! (Must be a .zip containing uuid.txt)
labels: ["squid-submission"]

body:
  - type: input
    id: name
    attributes:
      label: Squid Nickname
      placeholder: Squid
    validations:
      required: true

  - type: input
    id: save_url
    attributes:
      label: Save File URL
      description: |
        First, upload your Dosidicus .zip in the issue's comment box by
        dragging the file into the comment area. GitHub will upload it
        and create a link. Copy that link and paste it here.
      placeholder: https://github.com/user-attachments/files/...
    validations:
      required: true
