<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Squid Breeder</title>

<script src="vendor/jszip.min.js"></script>
<script src="vendor/dosidicus_data.js"></script>

<style>
body {
    font-family: Arial;
    background: #0f1220;
    color: #e0e6ff;
    padding: 20px;
}

.container {
    display: flex;
    gap: 20px;
}

.panel {
    flex: 1;
    background: #1a1f3a;
    padding: 15px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
}

textarea {
    width: 100%;
    min-height: 150px;
    resize: both;
    background: #0b0e1a;
    color: #cfd8ff;
    border: none;
    padding: 10px;
}

.canvas-wrapper {
    display: flex;
    justify-content: center;
    margin-top: 10px;
}

canvas {
    width: 400px;
    height: 300px;
    background: #0b0e1a;
}

.controls {
    font-size: 13px;
    margin-top: 10px;
}

label { margin-right: 10px; }
</style>
</head>

<body>

<h1>🧬 Squid Breeder</h1>

<div class="container">
<div class="panel">
<h3>Squid A</h3>
<input type="file" onchange="loadFile(event,'A')">
<textarea id="inputA"></textarea>
<div class="canvas-wrapper"><canvas id="canvasA" width="400" height="300"></canvas></div>
</div>

<div class="panel">
<h3>Squid B</h3>
<input type="file" onchange="loadFile(event,'B')">
<textarea id="inputB"></textarea>
<div class="canvas-wrapper"><canvas id="canvasB" width="400" height="300"></canvas></div>
</div>
</div>

<button onclick="breed()" style="background: #ff69b4; color: white; padding: 20px 40px; font-size: 26px; border: none; border-radius: 10px; cursor: pointer; display: block; margin: 20px auto;">BREED</button>

<button id="saveBtn" onclick="saveJSON()" style="background: #3399ff; color: white; padding: 15px 30px; font-size: 20px; border: none; border-radius: 10px; cursor: pointer; display: none; margin: -10px auto 20px auto;">💾 Save Child Brain</button>

<div class="panel">
<h3>Offspring</h3>

<div class="controls">
<b>Inherited From:</b><br>
<label><input type="checkbox" id="fA" checked>Parent A</label>
<label><input type="checkbox" id="fB" checked>Parent B</label>
<label><input type="checkbox" id="fBoth" checked>Both Parents</label>
<span style="font-size:13px;opacity:.8">&nbsp; green: A &nbsp; blue: B &nbsp; grey: as every squid hatches</span>

<br><br><b>Neuron Type:</b><br>
<label><input type="checkbox" id="fCore" checked>Core</label>
<label><input type="checkbox" id="fCustom" checked>Custom</label>

<br><br><b>View Mode:</b><br>
<label><input type="checkbox" id="heatmap">Weight Δ Heatmap</label>

<br><br><b>How to breed:</b><br>
<label><input type="radio" name="mode" id="modeGame" checked>As the game does</label>
<label><input type="radio" name="mode" id="modeBlend">Free blend (not what the game does)</label>
<p id="modeNote" style="font-size:13px;opacity:.85;max-width:780px"></p>

<b>Mutation:</b><br>
Rate <input type="range" id="mutRate" min="0" max="1" step="0.01" value="0.1"> <span id="mutRateValue"></span>
Strength <input type="range" id="mutStrength" min="0" max="2" step="0.05" value="0.1"> <span id="mutStrengthValue"></span>
<button type="button" onclick="gameMutation()" style="margin-left:10px">Game's values</button>
</div>

<textarea id="output"></textarea>
<div class="canvas-wrapper">
<canvas id="canvasOffspring" width="400" height="300"></canvas>
</div>

<div id="probe"></div>
</div>

<script>

// ================= LOAD =================

async function loadFile(e,t){
    const f=e.target.files[0];
    if(!f) return;

    if(f.name.endsWith(".zip")){
        // A save holds several JSON files. The brain is brain_state.json;
        // taking whichever came first loaded game_state.json, which has no
        // brain in it at all.
        const zip=await JSZip.loadAsync(f);
        const names=Object.keys(zip.files);
        const pick=["brain_state.json","custom_brain.json"]
            .map(want=>names.find(k=>k.split("/").pop()===want)).find(Boolean)
            || names.find(k=>k.endsWith(".json"));
        if(!pick){ alert("That zip has no brain in it."); return; }
        let txt=await zip.files[pick].async("string");
        if(txt.trim()==="null" && pick.endsWith("custom_brain.json")){
            const other=names.find(k=>k.endsWith("brain_state.json"));
            if(other) txt=await zip.files[other].async("string");
        }
        input(t).value=txt;
        renderNetwork(t);
    } else {
        input(t).value=await f.text();
        renderNetwork(t);
    }
}

const input = t => document.getElementById("input"+t);

// ================= BREED =================

// What the game does (src/inheritance.py), step for step:
//
//   * each parent passes on a GAMETE: a random half of its synapses between
//     the neurons every squid is born with. No neuron a parent grew is
//     inherited - a hatchling grows its own;
//   * the hatchling starts as a newborn brain, and both gametes are laid over
//     its innate wiring. Where both parents passed on the same synapse, one
//     of them is chosen at random;
//   * a tenth of the inherited weights mutate, by up to 0.1 either way, and
//     every weight stays within -1 to 1.
//
// The newborn brain and the two numbers come from the game itself
// (vendor/dosidicus_data.js, written by tools/update_extras_data.py).
const GAME=window.DOSIDICUS||null;

function gameteOf(parent){
    const born=new Set(Object.keys(GAME.newborn_neurons));
    const edges=Object.keys(parent.weights).filter(k=>{
        const [a,b]=k.split("|");
        return a!==b && born.has(a) && born.has(b) && Number.isFinite(parent.weights[k]);
    }).sort();
    // a random half, without replacement
    for(let i=edges.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [edges[i],edges[j]]=[edges[j],edges[i]];
    }
    const genes={};
    edges.slice(0,Math.floor(edges.length/2)).slice(0,GAME.max_genes).forEach(k=>{
        genes[k]=Math.max(-1,Math.min(1,Math.round(parent.weights[k]*1e4)/1e4));
    });
    return genes;
}

function breedAsTheGameDoes(A,B){
    const rate=+mutRate.value, size=+mutStrength.value;
    const child={neurons:{},weights:{},state:{},_lineage:{neurons:{},weights:{},mutated:[]}};
    for(const [name,pos] of Object.entries(GAME.newborn_neurons)){
        child.neurons[name]={position:pos.slice()};
        child._lineage.neurons[name]="innate";
    }
    for(const [src,dst,w] of GAME.newborn_connections){
        child.weights[src+"|"+dst]=w;
        child._lineage.weights[src+"|"+dst]="innate";
    }
    const offered={};
    [["A",gameteOf(A)],["B",gameteOf(B)]].forEach(([who,genes])=>{
        for(const k in genes) (offered[k]=offered[k]||[]).push([who,genes[k]]);
    });
    Object.keys(offered).sort().forEach(k=>{
        const [who,weight]=offered[k][Math.floor(Math.random()*offered[k].length)];
        let w=weight;
        if(Math.random()<rate){
            w=Math.max(-1,Math.min(1,w+(Math.random()*2-1)*size));
            child._lineage.mutated.push(k);
        }
        child.weights[k]=Math.round(w*1e4)/1e4;
        child._lineage.weights[k]=who;
    });
    child._bred={how:"as the game does",mutation_rate:rate,mutation_size:size,
                 inherited:Object.keys(offered).length,
                 left_behind:{A:grownBy(A),B:grownBy(B)}};
    return child;
}

function grownBy(parent){
    const born=new Set(Object.keys(GAME.newborn_neurons));
    return Object.keys(parent.neurons||{}).filter(n=>!born.has(n)).sort();
}

function breedByBlending(A,B){
    const child=structuredClone(A);
    child._lineage={neurons:{},weights:{},mutated:[]};
    for(let n in B.neurons){
        if(!child.neurons[n]){
            child.neurons[n]=B.neurons[n];
            child._lineage.neurons[n]="B";
        } else child._lineage.neurons[n]="both";
    }
    for(let n in A.neurons){
        if(!child._lineage.neurons[n]) child._lineage.neurons[n]="A";
    }
    child.weights={};
    const keys=new Set([...Object.keys(A.weights),...Object.keys(B.weights)]);
    keys.forEach(k=>{
        const inA=k in A.weights;
        const inB=k in B.weights;
        const wa=A.weights[k]??rand();
        const wb=B.weights[k]??rand();
        child.weights[k]=(wa+wb)/2;
        child._lineage.weights[k]=inA&&inB?"both":(inA?"A":"B");
    });
    mutate(child);
    child._bred={how:"free blend - not how the game breeds"};
    return child;
}

// What is written out is a brain the game can load (Network tab > Load
// brain): neurons with positions and a list of connections. It used to be
// this tool's own "source|target" map, which nothing in the game reads.
function brainFile(child){
    const connections=Object.keys(child.weights).sort().map(k=>{
        const [source,target]=k.split("|");
        return {source,target,weight:child.weights[k]};
    }).filter(c=>child.neurons[c.source]&&child.neurons[c.target]);
    const neurons={};
    for(const [name,n] of Object.entries(child.neurons)) neurons[name]={position:n.position};
    return {neurons,connections,bred:child._bred,lineage:child._lineage.weights,
            mutated:child._lineage.mutated};
}

function breed(){
    let A,B;
    try{
        A=normaliseBrain(JSON.parse(inputA.value));
        B=normaliseBrain(JSON.parse(inputB.value));
    }catch(e){ alert("Load a brain for both squid first."); return; }
    if(!A||!A.neurons||!B||!B.neurons){ alert("One of those is not a brain."); return; }

    const asGame=modeGame.checked && GAME;
    const child=asGame?breedAsTheGameDoes(A,B):breedByBlending(A,B);

    output.value=JSON.stringify(brainFile(child),null,2);
    renderOffspring(child);

    window._offspring=child;
    window._parentA=A;
    window._parentB=B;

    describeMode(child);
    document.getElementById("saveBtn").style.display = "block";
}

function describeMode(child){
    const note=document.getElementById("modeNote");
    if(modeGame.checked && GAME){
        let text="A random half of each parent's newborn wiring, laid over a newborn brain; "+
                 "where both passed on the same synapse one is chosen at random; "+
                 "then mutation. No grown neuron is inherited.";
        if(child && child._bred){
            const left=child._bred.left_behind;
            text+=` This child inherited ${child._bred.inherited} synapses, `+
                  `${child._lineage.mutated.length} of them mutated.`;
            if(left.A.length||left.B.length)
                text+=` Not inherited: ${[...new Set([...left.A,...left.B])].join(", ")}.`;
        }
        note.textContent=text;
    } else {
        note.textContent="Every weight is the average of the two parents', missing ones are "+
                         "random, and every neuron either parent has is kept. The game never does this.";
    }
}

function gameMutation(){
    if(!GAME) return;
    mutRate.value=GAME.mutation_rate;
    mutStrength.value=GAME.mutation_size;
    showMutation();
}
function showMutation(){
    mutRateValue.textContent=(+mutRate.value).toFixed(2)+(GAME&&+mutRate.value===GAME.mutation_rate?" (game)":"");
    mutStrengthValue.textContent=(+mutStrength.value).toFixed(2)+(GAME&&+mutStrength.value===GAME.mutation_size?" (game)":"");
}

// ================= SAVE =================

function saveJSON() {
    const data = document.getElementById("output").value;
    if (!data) return;

    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    
    const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    link.href = url;
    link.download = `squid_offspring_${timestamp}.json`;
    
    document.body.appendChild(link);
    link.click();
    
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

// ================= MUTATION =================

function mutate(net){
    const rate=+mutRate.value;
    const strength=+mutStrength.value;

    for(let k in net.weights){
        if(Math.random()<rate){
            net.weights[k]+=rand()*strength;
        }
    }

    // structural mutation (rare)
    if(Math.random()<rate){
        const nodes=Object.keys(net.neurons);
        const a=nodes[Math.floor(Math.random()*nodes.length)];
        const b=nodes[Math.floor(Math.random()*nodes.length)];
        const key=a+"|"+b;
        net.weights[key]=rand();
        net._lineage.weights[key]="novel";
    }
}

const rand=()=>Math.random()*2-1;

// ================= RENDER =================

function renderNetwork(t){
    try{ render(normaliseBrain(JSON.parse(input(t).value)),"canvas"+t); }catch{}
}

// ---------------------------------------------------------------------------
// Accept every brain format the project actually writes.
//
// This tool only ever understood `weights` as an object keyed "source|target",
// which is its own internal shape and not one anything in Dosidicus produces:
// the headless trainer writes `connections` (a list of {source, target,
// weight}), the game's save writes `weights_list` (a list of [source, target,
// weight]), and the Designer writes `connections` too. Given any real brain
// file this tool found no weights at all and drew eight unconnected dots.
function normaliseBrain(data){
    if(!data || typeof data !== "object") return data;

    // Neurons: accept {name: {position: [x,y]}} and [{name, position}].
    if(Array.isArray(data.neurons)){
        const asMap={};
        for(const n of data.neurons){ if(n && n.name) asMap[n.name]=n; }
        data.neurons=asMap;
    }
    if(!data.neurons && data.neuron_positions){
        data.neurons={};
        for(const [name,pos] of Object.entries(data.neuron_positions)){
            data.neurons[name]={position:pos};
        }
    }

    // Weights: build the "source|target" map this tool works in.
    if(!data.weights || Array.isArray(data.weights)){
        const map={};
        const add=(src,dst,w)=>{ if(src&&dst) map[`${src}|${dst}`]=Number(w)||0; };

        if(Array.isArray(data.weights)){
            for(const row of data.weights){
                if(Array.isArray(row)) add(row[0],row[1],row[2]);
            }
        }
        for(const row of data.connections||[]){
            if(Array.isArray(row)) add(row[0],row[1],row[2]);
            else if(row) add(row.source??row.from, row.target??row.to, row.weight);
        }
        for(const row of data.weights_list||[]){
            if(Array.isArray(row)) add(row[0],row[1],row[2]);
        }
        data.weights=map;
    }
    return data;
}

function renderOffspring(d){ render(d,"canvasOffspring",true); }

function render(data,id,isOffspring=false){
    const c=document.getElementById(id);
    const ctx=c.getContext("2d");
    ctx.clearRect(0,0,c.width,c.height);

    if(!data.neurons) return;

    const scale=fit(data.neurons);

    const heat=heatmap.checked;

    // connections
    for(let k in data.weights||{}){
        const [a,b]=k.split("|");
        if(!data.neurons[a]||!data.neurons[b]) continue;

        const origin=data._lineage?.weights?.[k]||"both";
        if(!pass(origin)) continue;

        const p1=scale(data.neurons[a].position);
        const p2=scale(data.neurons[b].position);

        ctx.beginPath();
        ctx.moveTo(...p1);
        ctx.lineTo(...p2);

        ctx.strokeStyle = heat ? heatColor(k) : color(origin);
        ctx.globalAlpha = origin==="novel"?1:0.7;
        ctx.stroke();
    }

    // neurons
    for(let n in data.neurons){
        const neuron=data.neurons[n];
        const origin=data._lineage?.neurons?.[n]||"both";

        if(!pass(origin)) continue;
        if(neuron.is_core && !fCore.checked) continue;
        if(neuron.is_custom && !fCustom.checked) continue;

        const [x,y]=scale(neuron.position);

        ctx.beginPath();
        ctx.arc(x,y,8,0,Math.PI*2);
        ctx.fillStyle=color(origin);
        ctx.fill();
    }

    // click probe
    c.onclick=e=>probeClick(e,data,scale);
}

// ================= HELPERS =================

function pass(o){
    return (o==="A"&&fA.checked)||(o==="B"&&fB.checked)||(o==="both"&&fBoth.checked)
        ||(o==="novel")||(o==="innate");
}

function color(o){
    if(o==="A") return "#00ff88";
    if(o==="B") return "#3399ff";
    if(o==="novel") return "#ffcc00";
    if(o==="innate") return "#777777";     // as it hatched: from neither parent
    return "#ffffff";
}

function heatColor(k){
    const a=window._parentA?.weights?.[k]??0;
    const b=window._parentB?.weights?.[k]??0;
    const d=a-b;

    const v=Math.min(1,Math.abs(d));
    if(d>0) return `rgba(0,255,0,${v})`;
    return `rgba(255,0,0,${v})`;
}

// fit network into canvas
function fit(neurons){
    const xs=Object.values(neurons).map(n=>n.position[0]);
    const ys=Object.values(neurons).map(n=>n.position[1]);

    const minX=Math.min(...xs), maxX=Math.max(...xs);
    const minY=Math.min(...ys), maxY=Math.max(...ys);

    const w=maxX-minX, h=maxY-minY;

    return ([x,y])=>{
        return [
            ((x-minX)/w)*350+25,
            ((y-minY)/h)*250+25
        ];
    };
}

// ================= PROBE =================

function probeClick(e,data,scale){
    const rect=e.target.getBoundingClientRect();
    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;

    for(let n in data.neurons){
        const [nx,ny]=scale(data.neurons[n].position);
        if(Math.hypot(nx-x,ny-y)<10){
            const val=forward(data,n);
            probe.innerText=`Neuron: ${n} → ${val.toFixed(3)}`;
            return;
        }
    }
}

function forward(net,target){
    let val=net.state?.[target]||0;

    for(let k in net.weights){
        const [a,b]=k.split("|");
        if(b===target){
            val += (net.state?.[a]||0)*net.weights[k];
        }
    }

    return Math.tanh(val);
}

// ================= UI =================

["mutRate","mutStrength"].forEach(id=>document.getElementById(id).oninput=showMutation);
["modeGame","modeBlend"].forEach(id=>document.getElementById(id).onchange=()=>describeMode(null));
gameMutation();
describeMode(null);

["fA","fB","fBoth","fCore","fCustom","heatmap"].forEach(id=>{
    document.getElementById(id).onchange=()=>{
        if(window._offspring) renderOffspring(window._offspring);
    };
});

</script>

</body>
</html>
