name: Build (PyInstaller)

on:
  workflow_dispatch:

jobs:
  build:

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyqt5 numpy

    - name: Build executable
      run: |
        pyinstaller --onedir --clean --noconfirm main.py

    - name: Create release directory
      run: |
        mkdir release

    - name: Copy repository structure (excluding Docs)
      run: |
        rsync -a --exclude Docs ./ release/

    - name: Remove python entrypoint
      run: |
        rm -f release/main.py || true

    - name: Insert compiled executable
      run: |
        cp -r dist/main/* release/

    - name: Create zip
      run: |
        cd release
        zip -r ../app-pyinstaller-${{ runner.os }}.zip .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pyinstaller-${{ runner.os }}
        path: app-pyinstaller-${{ runner.os }}.zip
