name: Build (Nuitka)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka pyqt5 numpy

    - name: Install macOS icon dependency
      if: runner.os == 'macOS'
      run: pip install imageio

    - name: Build executable
      run: |
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          ICON_FLAG="--windows-icon-from-ico=images/icons/squidblack.ico"
        elif [[ "${{ runner.os }}" == "Linux" ]]; then
          ICON_FLAG="--linux-icon=images/icons/squidblack.png"
        else
          ICON_FLAG="--macos-app-icon=images/icons/squidblack.png"
        fi

        python -m nuitka \
          --mode=app \
          --windows-console-mode=force \
          --assume-yes-for-downloads \
          --enable-plugin=pyqt5 \
          --output-dir=build \
          --output-filename=Dosidicus \
          --include-package=src \
          --include-package=plugins \
          --include-module=uuid \
          $ICON_FLAG \
          main.py

    - name: Create release directory
      run: mkdir release

    - name: Copy repository structure
      run: |
        for item in *; do
          case "$item" in
            release|dist|build|__pycache__) ;;
            *) cp -r "$item" release/ 2>/dev/null || true ;;
          esac
        done

    - name: Remove python entrypoint
      run: rm -f release/main.py || true

    - name: Insert compiled executable
      run: |
        if [[ "${{ runner.os }}" == "macOS" ]]; then
          cp -r build/main.app release/
        else
          cp -r build/main.dist/* release/
        fi

    - name: Create zip
      run: |
        OS_NAME=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
        python -c "import shutil; shutil.make_archive('Dosidicus${{ github.ref_name }}-${OS_NAME}', 'zip', 'release')"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuitka-${{ runner.os }}
        path: Dosidicus${{ github.ref_name }}-*.zip

  smoke-test:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: nuitka-${{ runner.os }}
          path: test-dir

      - name: Extract and Prep
        shell: bash
        run: |
          cd test-dir
          unzip *.zip
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            chmod +x Dosidicus.app/Contents/MacOS/Dosidicus
            echo "BINARY=./Dosidicus.app/Contents/MacOS/Dosidicus" >> $GITHUB_ENV
          else
            chmod +x Dosidicus
            echo "BINARY=./Dosidicus" >> $GITHUB_ENV
          fi

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0

      - name: Run Smoke Test
        shell: bash
        run: |
          cd test-dir
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run --auto-servernum $BINARY > output.log 2>&1 &
          else
            $BINARY > output.log 2>&1 &
          fi
          
          PID=$!
          echo "Process started (PID: $PID). Waiting 20s for squid initialization..."
          sleep 20
          kill $PID || true
          
          echo "--- LOG OUTPUT ---"
          cat output.log
          echo "--- END LOG ---"
          
          if grep -q "\*\*\* A SQUID HAS HATCHED! \*\*\*" output.log; then
            echo "Success: Hatching confirmed on ${{ runner.os }}!"
          else
            echo "Error: Hatching string not found in logs."
            exit 1
          fi
