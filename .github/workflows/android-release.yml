name: Build Android Release APK

# Manual-only ("Run workflow" button) build of the NON-debug (release) APK.
#
# Unlike android-build.yml (which builds a debug APK on every push under
# android/), this never runs automatically — trigger it from the Actions tab
# → "Build Android Release APK" → "Run workflow".
#
# Signing: if the four ANDROID_* repository secrets are set (see below) the
# release APK is signed and zipaligned, ready to install / upload. If they are
# not set, an *unsigned* release APK is produced instead (it must be signed
# before it can be installed on a device).
#
#   ANDROID_KEYSTORE_BASE64   - base64 of your release .keystore/.jks
#   ANDROID_KEYSTORE_PASSWORD - keystore password
#   ANDROID_KEY_ALIAS         - key alias
#   ANDROID_KEY_PASSWORD      - key (alias) password
#
#   # create a keystore once, then base64-encode it for the secret:
#   keytool -genkey -v -keystore dosidicus.keystore -alias dosidicus \
#     -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 dosidicus.keystore   # paste into ANDROID_KEYSTORE_BASE64

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Optional version name (overrides buildozer.spec `version =`)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Android SDK + NDK are several GB; reclaim space the runner wastes on
      # toolchains we don't need so the download has room.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/lib/android/sdk/ndk" || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Buildozer's Android toolchain is happiest on JDK 17; the runner default
      # can be newer, so pin it explicitly.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        # The full autotools set is required: p4a's libffi recipe runs
        # autoreconf, which needs the libtool m4 macros (LT_SYS_SYMBOL_USCORE)
        # that libltdl-dev/automake provide in aclocal's search path.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip pkg-config \
            autoconf automake libtool libtool-bin libltdl-dev autopoint gettext \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 "Cython==0.29.37"

      - name: Test shared desktop and mobile engine
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install -r requirements.txt pytest
          python -m pytest tests android/tests -q

      - name: Package shared desktop engine
        run: python android/prepare_apk.py

      # Cache the global buildozer dir so the SDK/NDK download only happens once.
      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Apply version override
        if: ${{ inputs.version_override != '' }}
        working-directory: android
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['VERSION_OVERRIDE']
          if not re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,3}(?:[a-zA-Z0-9.-]*)?', version):
              raise SystemExit('Invalid version name')
          path = Path('buildozer.spec')
          path.write_text(re.sub(r'^version = .*$', f'version = {version}', path.read_text(), flags=re.M))
          PY

      - name: Decode signing keystore
        id: keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        # Pass password files to the signer after Buildozer exits, so verbose
        # build diagnostics never receive signing passwords in their environment.
        env:
          DOSIDICUS_KEYSTORE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DOSIDICUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          if [ -n "$DOSIDICUS_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/store-password"
            printf '%s' "$ANDROID_KEY_PASSWORD" > "$RUNNER_TEMP/key-password"
            export DOSIDICUS_STOREPASS_FILE="$RUNNER_TEMP/store-password"
            export DOSIDICUS_KEYPASS_FILE="$RUNNER_TEMP/key-password"
          fi
          unset ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::buildozer attempt $attempt"
            if bash build_release.sh < <(yes) 2>&1 | tee build.log; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::buildozer release attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          echo "::error::buildozer failed after 3 attempts"
          exit 1

      - name: Summarise output
        if: success()
        working-directory: android
        run: |
          ls -la bin/ || true
          if ls bin/*-release-unsigned.apk >/dev/null 2>&1; then
            echo "::warning::Built an UNSIGNED release APK. Set the ANDROID_* secrets to get a signed, installable APK."
          fi

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dosidicus-release-apk
          path: android/bin/*.apk
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-release-build-log
          path: android/build.log
          if-no-files-found: ignore
