name: Build & Release

# ──────────────────────────────────────────────
#  Trigger: click "Run workflow" in GitHub UI
#  (Actions tab → Build & Release → Run workflow)
# ──────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag  (e.g. v2.6.1.2)'
        required: true
        default: 'v2.6.1.2'
      release_name:
        description: 'Release title  (leave blank to use tag)'
        required: false
      prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: false

jobs:
  # ────────────────────────────────────────────
  #  BUILD — runs in parallel on all 3 platforms
  # ────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false          # keep building other platforms if one fails
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: Dosidicus-windows.zip

          - os: macos-latest
            platform: macos
            artifact: Dosidicus-macos.zip

          - os: ubuntu-latest
            platform: linux
            artifact: Dosidicus-linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      # 1. Checkout — sparse on all platforms to exclude Docs/
      #    (contains a pipe character in a filename, illegal on Windows NTFS)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            plugins
            translations
            custom_brains
            example_squids
            images
            headless
            extras
            main.py
            requirements.txt
            config.ini
            version
            dosidicus.spec
            SaveViewer.html
            CITATION.cff
            LICENSE
          sparse-checkout-cone-mode: false

      # 2. Python 3.11 — good balance of compatibility and PyQt5 support
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install Python dependencies + PyInstaller
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      # 4. Linux — install Qt system libraries (needed on the GitHub runner)
      - name: Install Qt system libs (Linux only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libglib2.0-0 libgl1 libegl1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0

      # 5. Build with PyInstaller using the shared spec file
      - name: Build with PyInstaller
        run: pyinstaller dosidicus.spec --noconfirm

      # 6a. Package — Windows & Linux (zip the dist/Dosidicus folder)
      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist\Dosidicus\* -DestinationPath ${{ matrix.artifact }}

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: zip -r ${{ matrix.artifact }} dist/Dosidicus/

      # 6b. Package — macOS (.app bundle → zip)
      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact }} Dosidicus.app

      # 7. Upload the zip as a workflow artifact (picked up by the release job)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # ────────────────────────────────────────────
  #  RELEASE — runs after all 3 builds succeed
  # ────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write         # needed to create a GitHub Release

    steps:
      # Download all three zips
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # Create the GitHub Release and attach the zips
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.release_name || github.event.inputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true     # auto-generates changelog from commits
          files: release-assets/*.zip
          body: |
            ## Dosidicus ${{ github.event.inputs.tag }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | 🪟 Windows | `Dosidicus-windows.zip` — extract and run `Dosidicus.exe` |
            | 🍎 macOS   | `Dosidicus-macos.zip` — extract and open `Dosidicus.app` |
            | 🐧 Linux   | `Dosidicus-linux.zip` — extract and run `./Dosidicus` |

            > [!NOTE]
            > **macOS users:** if Gatekeeper blocks the app, right-click → Open, or run
            > `xattr -cr Dosidicus.app` in Terminal after extracting.
            >
            > **Linux users:** make sure the binary is executable: `chmod +x Dosidicus`
