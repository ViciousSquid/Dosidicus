name: Submit a Squid Save
description: Submit your evolved Dosidicus squid
labels:
  - squid-submission

body:
  - type: markdown
    attributes:
      value: |
        IMPORTANT: Enter your squid's name in the Add a title field above.

        After submitting this form, upload your Dosidicus ZIP
        by dragging it into a comment on the newly-created issue.

        The Squid Exchange will process the uploaded save automatically.
