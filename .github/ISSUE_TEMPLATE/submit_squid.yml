name: 🦑 Submit a Squid Save
description: Share your evolved squid! (Must be a .zip containing uuid.txt)
labels: ["squid-submission"]
body:
  - type: input
    id: name
    attributes:
      label: Squid Nickname
      placeholder: Squid
    validations:
      required: true
  - type: input
    id: save_url
    attributes:
      label: Save File (.zip)
      description: Drag and drop your ZIP here, then copy the link.
    validations:
      required: true
