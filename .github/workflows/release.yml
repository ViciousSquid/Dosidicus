name: Build and Release

on:
workflow_dispatch:
push:
branches:
- "**"
tags:
- "v*"

jobs:

build:

```
strategy:
  matrix:
    os: [ubuntu-latest, windows-latest, macos-latest]

runs-on: ${{ matrix.os }}

env:
  BRANCH_NAME: ${{ github.ref_name }}

steps:

  - name: Checkout repository
    uses: actions/checkout@v4


  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"


  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pyinstaller


  # -------------------------
  # LINUX BUILD (.AppImage)
  # -------------------------

  - name: Build Linux executable
    if: matrix.os == 'ubuntu-latest'
    run: |
      pyinstaller packaging/pyinstaller.spec

      mkdir -p AppDir/usr/bin
      cp -r dist/dosidicus/* AppDir/usr/bin/

      wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage

      chmod +x appimagetool-x86_64.AppImage

      ./appimagetool-x86_64.AppImage AppDir Dosidicus_${BRANCH_NAME}_linux.AppImage


  # -------------------------
  # WINDOWS BUILD (.zip)
  # -------------------------

  - name: Build Windows executable
    if: matrix.os == 'windows-latest'
    run: |
      pyinstaller packaging/pyinstaller.spec
      powershell Compress-Archive -Path dist\dosidicus\* -DestinationPath Dosidicus_${env:BRANCH_NAME}_windows.zip


  # -------------------------
  # MAC BUILD (.dmg)
  # -------------------------

  - name: Build macOS app
    if: matrix.os == 'macos-latest'
    run: |
      pyinstaller packaging/pyinstaller.spec

      mkdir dmg
      cp -r dist/dosidicus dmg/Dosidicus.app

      hdiutil create -volname Dosidicus \
        -srcfolder dmg \
        -ov -format UDZO Dosidicus_${BRANCH_NAME}_mac.dmg


  # -------------------------
  # Upload build artifacts
  # -------------------------

  - name: Upload artifacts
    uses: actions/upload-artifact@v4
    with:
      name: binaries-${{ matrix.os }}
      path: |
        *.AppImage
        *.zip
        *.dmg
```

release:

```
needs: build

runs-on: ubuntu-latest

steps:

  - name: Download artifacts
    uses: actions/download-artifact@v4
    with:
      path: artifacts


  - name: Create GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      files: artifacts/**/*
```
