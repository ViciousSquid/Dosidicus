name: 🦑 Submit a Squid Save
description: Share your evolved squid!
labels: ["squid-submission"]

body:
  - type: input
    id: name
    attributes:
      label: Squid Nickname
      description: Give your squid a name.
      placeholder: Gaspard
    validations:
      required: true

  - type: textarea
    id: save_url
    attributes:
      label: Save File (.zip)
      description: Drag your Dosidicus ZIP into this box. GitHub will upload it and insert the attachment link.
      placeholder: Drag your .zip file here
    validations:
      required: true

  - type: input
    id: parent_id
    attributes:
      label: Parent Specimen ID
      description: If this squid descended from an Exchange specimen, enter its specimen ID. Otherwise leave blank.
      placeholder: dosidicus-...
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: About this squid
      description: Tell us something about this squid's personality, behaviour, or history.
      placeholder: Curious and unusually persistent.
    validations:
      required: false
