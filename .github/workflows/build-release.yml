name: Build Executables

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build executable
      run: |
        pyinstaller --onedir --noconfirm --clean main.py

    # Create a folder that mirrors the repo
    - name: Copy repo structure
      run: |
        mkdir release
        cp -r * release/ || true

    # Remove source python entrypoint
    - name: Remove source entry script
      run: |
        rm -f release/main.py || true

    # Copy compiled executable into the mirrored structure
    - name: Insert executable
      run: |
        cp dist/main/* release/

    - name: Zip release
      run: |
        cd release
        zip -r ../app-${{ matrix.os }}.zip .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ matrix.os }}
        path: app-${{ matrix.os }}.zip
