name: 🦑 Submit a Squid Save
description: Share your evolved squid! (Must be a .zip containing uuid.txt)
labels: ["squid-submission"]

body:
  - type: input
    id: name
    attributes:
      label: Squid Nickname
      description: Give your squid a name.
      placeholder: Gaspard
    validations:
      required: true

  - type: input
    id: save_url
    attributes:
      label: Save File (.zip)
      description: Drag and drop your Dosidicus ZIP here, then copy the link.
      placeholder: https://github.com/...
    validations:
      required: true

  - type: input
    id: parent_id
    attributes:
      label: Parent Specimen ID
      description: If this squid descended from an Exchange specimen, enter its specimen ID. Otherwise leave blank.
      placeholder: dosidicus-...
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: About this squid
      description: Tell us something about this squid's personality, behaviour, or history.
      placeholder: |
        Curious and unusually persistent.
        Developed a tendency to explore unfamiliar environments.
    validations:
      required: false
