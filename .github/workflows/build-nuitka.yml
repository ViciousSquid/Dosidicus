name: Build (Nuitka)

on:
  workflow_call:
    inputs:
      release_version:
        type: string
        required: false
        default: ""
  workflow_dispatch:
  # Also produce a downloadable diagnostic artifact when packaging changes.
  push:
    branches:
      - 3.2.0_LatestVersion
      - "claude/**"
    paths:
      - ".github/workflows/build-nuitka.yml"
      - "tools/macos_debug.command"
      - "tools/MACOS_DEBUG_README.txt"
      - "tools/build_macos_dmg.sh"
      - "tools/merge_macos_universal.py"
      - "tools/macos_smoke_test.sh"
      - "tests/test_macos_runtime.py"
      - "src/macos_runtime.py"
      # The game loads its fonts as it starts: a font a system refuses is a
      # build that does not start there.
      - "src/fonts/**"
      - "tools/subset_emoji_font.py"

jobs:
  build:
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            asset: windows
          - os: ubuntu-22.04
            architecture: x64
            asset: linux
          - os: macos-latest
            architecture: arm64
            asset: macos-arm64
          - os: macos-15-intel
            architecture: x64
            asset: macos-x64

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.architecture }}
          cache: pip

      - name: Apply release version
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python tools/release_support.py version --version "$RELEASE_VERSION"
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nuitka==4.2.2" -r requirements.txt zstandard

      - name: Test macOS writable runtime bootstrap
        if: runner.os == 'macOS'
        run: python -m unittest discover -s tests -p 'test_macos_runtime.py' -v

      - name: Install macOS icon dependency
        if: runner.os == 'macOS'
        run: pip install imageio

      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 patchelf

      - name: Build executable
        run: |
          # Configure platform-specific flags and modes dynamically
          # PyQt5's Linux wheel ships no 'styles' plugin family (Fusion is
          # built in), and Nuitka stops with a FATAL error if asked for one
          # that does not exist. Windows and macOS need theirs for the native
          # look.
          QT_PLUGINS="sensible,platforms,styles,imageformats"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PLATFORM_FLAGS="--mode=standalone --windows-icon-from-ico=images/icons/squidblack.ico --windows-console-mode=force"
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            PLATFORM_FLAGS="--mode=standalone --linux-icon=images/icons/squidblack.png"
            # The wayland-* families let the build run on a Wayland session
            # as itself, not only through XWayland.
            QT_PLUGINS="sensible,platforms,imageformats,wayland-shell-integration,wayland-decoration-client,wayland-graphics-integration-client"
          else
            # On macOS, the app bundle flag replaces the standalone mode flag entirely
            PLATFORM_FLAGS="--macos-create-app-bundle --macos-app-name=Dosidicus --macos-app-icon=images/icons/squidblack.png --macos-disable-console"
          fi

          # Keep release and diagnostic builds on identical modules/plugins.
          # Only console handling, buffering, and output directory differ.
          COMMON_NUITKA_ARGS=(
            --assume-yes-for-downloads
            --enable-plugin=pyqt5
            "--include-qt-plugins=$QT_PLUGINS"
            --disable-plugin=options-nanny
            --include-package=src
            --include-package=plugins
            --include-package=translations
            --include-module=uuid
            --include-module=src.brain_designer
            --include-module=src.brain_designer_launcher
            --include-module=src.brain_state_bridge
            --include-module=src.designer_canvas
            --include-module=src.designer_canvas_utils
            --include-module=src.designer_constants
            --include-module=src.designer_core
            --include-module=src.designer_dialogs
            --include-module=src.designer_logging
            --include-module=src.designer_network_generator
            --include-module=src.designer_outputs_panel
            --include-module=src.designer_panels
            --include-module=src.designer_sensor_discovery
            --include-module=src.designer_templates
            --include-module=src.designer_window
          )

          python -m nuitka $PLATFORM_FLAGS \
            --output-dir=build --output-filename=Dosidicus \
            "${COMMON_NUITKA_ARGS[@]}" main.py

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            # Separate executable: a launcher alone cannot re-enable stdout
            # on a binary compiled with --macos-disable-console.
            python -m nuitka \
              --macos-create-app-bundle \
              --macos-app-name=Dosidicus \
              --macos-app-icon=images/icons/squidblack.png \
              --macos-app-console-mode=force \
              --python-flag=unbuffered \
              --output-dir=build-debug --output-filename=Dosidicus \
              "${COMMON_NUITKA_ARGS[@]}" main.py
          fi

      - name: Show build output
        run: find build -maxdepth 2 | sort

      - name: Create release directory
        run: mkdir release

      - name: Insert compiled executable & configure bundle
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            # Nuitka places Qt platform plugins in PyQt5/qt-plugins, not Qt5/plugins.
            # qt.conf lives in Contents/Resources and resolves paths from Contents.
            mkdir -p build/main.app/Contents/Resources
            cat > build/main.app/Contents/Resources/qt.conf << 'EOF'
          [Paths]
          Plugins = ../MacOS/PyQt5/qt-plugins
          EOF
            
            # Move the clean app bundle base straight to the release folder
            cp -r build/main.app release/Dosidicus.app
          else
            # Windows and Linux use the standard standalone flat directory
            cp -r build/main.dist/. release/
          fi

      - name: Copy repository structure (Assets & Data)
        run: |
          # Determine the target directory based on OS
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            TARGET_DIR="release/Dosidicus.app/Contents/MacOS"
          else
            TARGET_DIR="release"
          fi

          python tools/release_support.py runtime --target "$TARGET_DIR"

      - name: Validate macOS Qt plugin bundle
        if: runner.os == 'macOS'
        run: |
          APP="release/Dosidicus.app"
          CONF="$APP/Contents/Resources/qt.conf"
          PLUGINS="$APP/Contents/MacOS/PyQt5/qt-plugins"
          test -x "$APP/Contents/MacOS/Dosidicus"
          test -f "$CONF"
          test -f "$PLUGINS/platforms/libqcocoa.dylib"
          grep -Fxq 'Plugins = ../MacOS/PyQt5/qt-plugins' "$CONF"
          echo "macOS Cocoa Qt platform plugin and qt.conf verified"

      - name: Ad-hoc sign for macOS
        if: runner.os == 'macOS'
        run: |
          codesign --deep --force --sign - "release/Dosidicus.app"

      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "release/Dosidicus.app"

      - name: Assemble and sign macOS debug build
        if: runner.os == 'macOS'
        run: |
          # Separate .app with a real console-enabled Mach-O executable.
          mkdir -p debug-release
          cp -R build-debug/main.app debug-release/Dosidicus.app
          mkdir -p debug-release/Dosidicus.app/Contents/Resources
          cp release/Dosidicus.app/Contents/Resources/qt.conf debug-release/Dosidicus.app/Contents/Resources/qt.conf
          python tools/release_support.py runtime --target debug-release/Dosidicus.app/Contents/MacOS

          test -x debug-release/Dosidicus.app/Contents/MacOS/Dosidicus
          test -f debug-release/Dosidicus.app/Contents/MacOS/PyQt5/qt-plugins/platforms/libqcocoa.dylib
          grep -Fxq 'Plugins = ../MacOS/PyQt5/qt-plugins' debug-release/Dosidicus.app/Contents/Resources/qt.conf
          codesign --deep --force --sign - debug-release/Dosidicus.app
          codesign --verify --deep --strict --verbose=2 debug-release/Dosidicus.app

          cp tools/macos_debug.command "debug-release/Run Dosidicus Debug.command"
          cp tools/MACOS_DEBUG_README.txt debug-release/README-DEBUG.txt
          chmod +x "debug-release/Run Dosidicus Debug.command"
          bash -n "debug-release/Run Dosidicus Debug.command"

      - name: Package macOS diagnostic ZIP
        if: runner.os == 'macOS'
        run: |
          cd debug-release
          zip -r -y "../Dosidicus-${{ matrix.asset }}-debug.zip" \
            Dosidicus.app "Run Dosidicus Debug.command" README-DEBUG.txt
          cd ..
          unzip -Z -1 "Dosidicus-${{ matrix.asset }}-debug.zip" | grep -Fxq "Run Dosidicus Debug.command"
          unzip -Z -1 "Dosidicus-${{ matrix.asset }}-debug.zip" | grep -Fxq "Dosidicus.app/Contents/MacOS/Dosidicus"

      - name: Upload macOS diagnostic build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-${{ matrix.asset }}-debug
          path: Dosidicus-${{ matrix.asset }}-debug.zip
          if-no-files-found: error

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./release/Dosidicus.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Compiled application failed --help" }

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          # The language splash waits for a click; nobody is here to give one.
          DOSIDICUS_SKIP_LANGUAGE_SPLASH: "1"
        run: |
          QT_QPA_PLATFORM=offscreen ./release/Dosidicus > smoke.log 2>&1 &
          PID=$!
          echo "Started PID $PID"

          for i in $(seq 1 30); do
            sleep 1
            if grep -q "Applied language from config" smoke.log 2>/dev/null; then
              echo "✅ Startup confirmed at ${i}s"
              cat smoke.log
              kill $PID 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 $PID 2>/dev/null; then
              echo "❌ Process exited before printing startup line"
              cat smoke.log
              exit 1
            fi
          done
          echo "❌ Startup line not seen after 30s"
          cat smoke.log
          kill $PID 2>/dev/null || true
          exit 1

      - name: Smoke test (macOS — Finder-style launch)
        if: runner.os == 'macOS'
        run: |
          # Test from /, not the writable checkout: Finder does not guarantee
          # the working directory and users install signed apps elsewhere.
          BIN="$GITHUB_WORKSPACE/release/Dosidicus.app/Contents/MacOS/Dosidicus"
          LOG="$GITHUB_WORKSPACE/smoke-macos.log"
          export DOSIDICUS_DATA_DIR="$RUNNER_TEMP/dosidicus-smoke-profile"
          export DOSIDICUS_SKIP_LANGUAGE_SPLASH=1
          mkdir -p "$DOSIDICUS_DATA_DIR"
          cd /
          QT_DEBUG_PLUGINS=1 "$BIN" > "$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          # "Applied language" is printed near the BEGINNING of MainWindow
          # construction. Requiring 15 more seconds catches subsequent
          # exceptions, native Qt crashes and missing user-write permissions.
          READY=0
          for i in $(seq 1 60); do
            sleep 1
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::macOS app exited before stable startup"
              cat "$LOG"
              wait "$PID" || true
              exit 1
            fi
            if grep -q "Applied language from config" "$LOG"; then
              READY=$((READY + 1))
              if [ "$READY" -ge 15 ]; then
                test -f "$DOSIDICUS_DATA_DIR/config.ini"
                test -L "$DOSIDICUS_DATA_DIR/images"
                echo "macOS app stayed alive through initialization and created writable user data"
                exit 0
              fi
            fi
          done
          echo "::error::macOS startup did not finish in 60 seconds"
          cat "$LOG"
          exit 1

      - name: Upload macOS startup log (on failure)
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-startup-log-${{ matrix.architecture }}
          path: smoke-macos.log
          if-no-files-found: ignore

      - name: Mark Linux binary executable
        if: runner.os == 'Linux'
        run: chmod +x release/Dosidicus

      - name: Create and verify macOS DMG installer
        if: runner.os == 'macOS'
        run: bash tools/build_macos_dmg.sh release/Dosidicus.app "Dosidicus-${{ matrix.asset }}.dmg"

      - name: Upload macOS DMG installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-${{ matrix.asset }}-dmg
          path: Dosidicus-${{ matrix.asset }}.dmg
          if-no-files-found: error

      - name: Create zip
        run: |
          OS_NAME="${{ matrix.asset }}"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            # On macOS, zip ONLY the .app bundle itself from within the release folder
            cd release
            zip -r -y "../Dosidicus-${OS_NAME}.zip" Dosidicus.app
            cd ..
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            python -c "import shutil; shutil.make_archive('Dosidicus-linux', 'gztar', 'release')"
          else
            # Windows standalone distribution
            python -c "import shutil; shutil.make_archive('Dosidicus-${OS_NAME}', 'zip', 'release')"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-${{ matrix.asset }}
          path: |
            Dosidicus-${{ matrix.asset }}.zip
            Dosidicus-linux.tar.gz
          if-no-files-found: error

  # One DMG for every Mac. The two macOS builds above are the same game
  # compiled for Apple Silicon and for Intel; this joins them into a single
  # universal app (tools/merge_macos_universal.py), signs it, starts it on an
  # Apple Silicon Mac here and on an Intel Mac in the next job, and only then
  # publishes the DMG - so no separate universal build has to be run.
  macos-universal:
    name: macOS universal app (merge, sign, start on Apple Silicon)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: nuitka-macos-arm64
          path: built/arm64

      - uses: actions/download-artifact@v4
        with:
          name: nuitka-macos-x64
          path: built/x64

      - name: Unpack both builds
        run: |
          # ditto keeps the bundles' permissions and framework links.
          ditto -x -k built/arm64/Dosidicus-macos-arm64.zip built/arm64
          ditto -x -k built/x64/Dosidicus-macos-x64.zip built/x64
          lipo built/arm64/Dosidicus.app/Contents/MacOS/Dosidicus -verify_arch arm64
          lipo built/x64/Dosidicus.app/Contents/MacOS/Dosidicus -verify_arch x86_64

      - name: Join them into one universal app
        run: |
          mkdir universal
          python3 tools/merge_macos_universal.py \
            built/arm64/Dosidicus.app built/x64/Dosidicus.app universal/Dosidicus.app \
            | tee merge-summary.txt
          {
            echo "### macOS universal app"
            echo '```'
            cat merge-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          lipo universal/Dosidicus.app/Contents/MacOS/Dosidicus -verify_arch x86_64 arm64
          test -f universal/Dosidicus.app/Contents/MacOS/PyQt5/qt-plugins/platforms/libqcocoa.dylib
          lipo universal/Dosidicus.app/Contents/MacOS/PyQt5/qt-plugins/platforms/libqcocoa.dylib \
            -verify_arch x86_64 arm64

      - name: Sign and verify
        run: |
          # Joining changes every compiled file, so every signature is redone.
          codesign --deep --force --sign - universal/Dosidicus.app
          codesign --verify --deep --strict --verbose=2 universal/Dosidicus.app

      - name: Start it on Apple Silicon
        run: bash tools/macos_smoke_test.sh "$PWD/universal/Dosidicus.app" arm64

      - name: Create and verify the universal DMG
        run: |
          bash tools/build_macos_dmg.sh universal/Dosidicus.app Dosidicus-macos-universal.dmg
          shasum -a 256 Dosidicus-macos-universal.dmg > Dosidicus-macos-universal.dmg.sha256

      - name: Keep it for the Intel check
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-candidate
          path: |
            Dosidicus-macos-universal.dmg
            Dosidicus-macos-universal.dmg.sha256
            universal/Dosidicus.app.merge.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload startup log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-startup-log-arm64
          path: smoke-macos.log
          if-no-files-found: ignore

  macos-universal-intel:
    name: macOS universal DMG (start on Intel, publish)
    needs: macos-universal
    runs-on: macos-15-intel
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: macos-universal-candidate
          path: candidate

      - name: Start it on Intel, from the read-only disk image
        run: |
          cd candidate
          shasum -a 256 -c Dosidicus-macos-universal.dmg.sha256
          cd ..
          hdiutil verify candidate/Dosidicus-macos-universal.dmg
          MOUNT="$RUNNER_TEMP/dosidicus-universal"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" candidate/Dosidicus-macos-universal.dmg
          trap 'hdiutil detach "$MOUNT" -force || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$MOUNT/Dosidicus.app"
          SMOKE_LOG="$GITHUB_WORKSPACE/smoke-macos.log" \
            bash tools/macos_smoke_test.sh "$MOUNT/Dosidicus.app" x86_64

      - name: Upload the universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-macos-universal-dmg
          path: candidate/Dosidicus-macos-universal.dmg
          if-no-files-found: error

      - name: Upload startup log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-startup-log-x64
          path: smoke-macos.log
          if-no-files-found: ignore

