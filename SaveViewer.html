<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosidicus Save Viewer v2.0 (Web)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --bg-panel: #252525;
            --bg-header: #2d2d2d;
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
            --accent: #3d6a8b;
            --accent-hover: #4d7a9b;
            --border: #444;
            --code-font: 'Consolas', 'Monaco', monospace;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Toolbar */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }

        h1 { margin: 0; font-size: 1.2rem; color: #fff; }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        button:hover { background-color: var(--accent-hover); }
        
        input[type="file"] { display: none; }

        /* Tabs */
        .tabs {
            background-color: var(--bg-header);
            display: flex;
            overflow-x: auto;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            padding: 12px 20px;
            cursor: pointer;
            font-size: 1rem;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        .tab-btn:hover { background-color: #353535; }
        .tab-btn.active {
            color: #fff;
            border-bottom-color: var(--accent);
            background-color: var(--bg-dark);
        }

        /* Content Area */
        #content-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Welcome Screen */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-dim);
        }
        #welcome-screen .icon { font-size: 64px; margin-bottom: 20px; }

        /* Components */
        .section {
            margin-bottom: 20px;
            border-radius: 6px;
            overflow: hidden;
        }

        .section-header {
            background-color: #2d5a7b;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
        }
        .section-header:hover { background-color: #3d6a8b; }
        .section-header::before {
            content: '▶';
            display: inline-block;
            margin-right: 10px;
            font-size: 0.8em;
            transition: transform 0.2s;
        }
        .section.open .section-header::before { transform: rotate(90deg); }

        .section-content {
            background-color: #1e1e1e;
            padding: 15px;
            display: none;
        }
        .section.open .section-content { display: block; }

        .kv-row {
            display: flex;
            padding: 4px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .kv-key {
            color: #7fbadc;
            font-weight: bold;
            min-width: 180px;
            width: 180px;
        }
        .kv-val { color: #e0e0e0; flex-grow: 1; word-break: break-all; }

        /* Canvas */
        #network-canvas {
            background-color: #1a1a1a;
            border-radius: 4px;
            cursor: grab;
        }
        #network-canvas:active { cursor: grabbing; }

        /* JSON Tree */
        .json-tree { font-family: var(--code-font); font-size: 0.9rem; }
        .json-tree ul { list-style: none; padding-left: 20px; margin: 0; }
        .json-tree li { margin: 2px 0; }
        .caret { cursor: pointer; user-select: none; color: #888; display: inline-block; width: 15px; }
        .caret-down::before { content: "▼"; font-size: 0.7em; }
        .caret-right::before { content: "▶"; font-size: 0.7em; }
        .nested { display: none; }
        .active { display: block; }
        .key { color: #9cdcfe; }
        .string { color: #ce9178; }
        .number { color: #b5cea8; }
        .boolean { color: #569cd6; }
        .null { color: #569cd6; }

        /* Specific Widgets */
        .memory-card {
            background-color: #252525;
            border-left: 3px solid #3d6a8b;
            margin: 5px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            margin-right: 10px;
        }
        .tag.environment { background-color: #4CAF50; }
        .tag.behavior { background-color: #9C27B0; }
        .tag.food { background-color: #FF9800; }
        .tag.interaction { background-color: #2196F3; }
        
        .stat-group-title {
            color: #7fbadc;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 1.1em;
        }

    </style>
</head>
<body>

<header>
    <h1>Dosidicus Save Viewer</h1>
    <button onclick="document.getElementById('file-input').click()">📂 Open Save File (.zip)</button>
    <input type="file" id="file-input" accept=".zip" onchange="handleFileSelect(event)">
    <span id="file-name" style="color: var(--text-dim);">No file loaded</span>
</header>

<div class="tabs" id="tabs-nav">
    </div>

<div id="content-area">
    <div id="welcome-screen">
        <div class="icon">🦑</div>
        <h2>Dosidicus Save Viewer</h2>
        <p>Upload a .zip save file to view its contents.</p>
    </div>
</div>

<script>
    let saveData = {};

    // --- File Handling ---

    async function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('file-name').textContent = file.name;
        
        const zip = new JSZip();
        try {
            const contents = await zip.loadAsync(file);
            saveData = {};
            
            // Process files
            const promises = [];
            
            // Explicitly look for uuid.txt first
            if(contents.files['uuid.txt']) {
                promises.push(contents.files['uuid.txt'].async('string').then(text => {
                    saveData['uuid_txt'] = text.trim();
                }));
            }

            // Process all JSON files
            for (const filename in contents.files) {
                if (filename.endsWith('.json')) {
                    const p = contents.files[filename].async('string').then(text => {
                        try {
                            const key = filename.replace('.json', '');
                            saveData[key] = JSON.parse(text);
                        } catch (e) {
                            console.error(`Error parsing ${filename}`, e);
                        }
                    });
                    promises.push(p);
                }
            }

            await Promise.all(promises);
            buildUI();

        } catch (err) {
            alert("Error reading zip file: " + err.message);
            console.error(err);
        }
    }

    // --- UI Building ---

    function buildUI() {
        const tabsNav = document.getElementById('tabs-nav');
        const contentArea = document.getElementById('content-area');
        
        // Clear previous
        tabsNav.innerHTML = '';
        contentArea.innerHTML = '';

        // 1. Overview Tab
        createTab('Overview', '📋 Overview', renderOverview, true);

        // 2. Network Tab (if brain_state exists)
        if (saveData['brain_state']) {
            createTab('Network', '🕸️ Network', renderNetwork);
        }

        // 3. File Tabs
        const fileOrder = ['game_state', 'brain_state', 'statistics', 'ShortTerm', 'LongTerm', 'achievements'];
        
        // Add specific order tabs first
        fileOrder.forEach(key => {
            if (saveData[key]) {
                const icon = getIconForKey(key);
                createTab(key, `${icon} ${key}.json`, () => renderJsonView(key, saveData[key], true)); // true = human readable mode
            }
        });

        // Add remaining files
        Object.keys(saveData).forEach(key => {
            if (!fileOrder.includes(key) && key !== 'uuid_txt') {
                createTab(key, `📄 ${key}.json`, () => renderJsonTree(saveData[key]));
            }
        });
    }

    function getIconForKey(key) {
        const icons = {
            'game_state': '🦑', 'brain_state': '🧠', 'statistics': '📊',
            'ShortTerm': '💭', 'LongTerm': '🧠', 'achievements': '🏆'
        };
        return icons[key] || '📄';
    }

    function createTab(id, label, renderFunction, isActive = false) {
        const nav = document.getElementById('tabs-nav');
        const contentArea = document.getElementById('content-area');

        // Button
        const btn = document.createElement('button');
        btn.className = `tab-btn ${isActive ? 'active' : ''}`;
        btn.textContent = label;
        btn.onclick = () => switchTab(id);
        nav.appendChild(btn);

        // Content Div
        const div = document.createElement('div');
        div.id = `tab-${id}`;
        div.className = `tab-content ${isActive ? 'active' : ''}`;
        contentArea.appendChild(div);

        // Render content immediately
        if (renderFunction) {
            const content = renderFunction();
            if (content) div.appendChild(content);
        }
    }

    function switchTab(id) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        // Find button by text content is tricky, let's rely on index or reconstruct logic. 
        // Easier: Attach ID to button or use event.target.
        // Re-implementing correctly:
        const index = Array.from(document.getElementById('content-area').children).findIndex(child => child.id === `tab-${id}`);
        document.querySelectorAll('.tab-btn')[index].classList.add('active');
        document.getElementById(`tab-${id}`).classList.add('active');
    }

    // --- Component Helpers ---

    function createCollapsible(title, contentNode, startOpen = true) {
        const section = document.createElement('div');
        section.className = `section ${startOpen ? 'open' : ''}`;

        const header = document.createElement('div');
        header.className = 'section-header';
        header.textContent = title;
        header.onclick = () => section.classList.toggle('open');

        const content = document.createElement('div');
        content.className = 'section-content';
        content.appendChild(contentNode);

        section.appendChild(header);
        section.appendChild(content);
        return section;
    }

    function createKVRow(key, val) {
        const row = document.createElement('div');
        row.className = 'kv-row';
        
        const k = document.createElement('div');
        k.className = 'kv-key';
        k.textContent = key + ':';
        
        const v = document.createElement('div');
        v.className = 'kv-val';
        v.textContent = val;

        row.appendChild(k);
        row.appendChild(v);
        return row;
    }

    function createNeuronRow(name, value) {
        const row = document.createElement('div');
        row.className = 'kv-row';
        
        const k = document.createElement('div');
        k.className = 'kv-key';
        k.style.color = '#b0b0b0'; // distinct from main keys
        k.textContent = name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

        const v = document.createElement('div');
        v.className = 'kv-val';
        
        // Simple numeric display without coloured bars
        if (typeof value === 'number') {
            v.textContent = Math.round(value * 100) / 100;
            v.style.fontWeight = 'bold';
        } else {
            v.textContent = value;
        }

        row.appendChild(k);
        row.appendChild(v);
        return row;
    }

    // --- RENDERERS ---

    // 1. Overview Renderer
    function renderOverview() {
        const container = document.createElement('div');

        // Squid Info
        const squidData = saveData.game_state?.squid || {};
        const stats = saveData.statistics || {};
        
        const infoDiv = document.createElement('div');
        infoDiv.appendChild(createKVRow('Name', squidData.name || 'Unknown'));
        infoDiv.appendChild(createKVRow('Personality', squidData.personality || 'Unknown'));
        infoDiv.appendChild(createKVRow('Health', squidData.is_sick ? 'Sick 🤒' : `Healthy (${squidData.health}%)`));
        infoDiv.appendChild(createKVRow('Age', formatAge(stats.total_age_seconds || 0)));
        if(squidData.uuid) infoDiv.appendChild(createKVRow('UUID', squidData.uuid));
        
        container.appendChild(createCollapsible('🦑 Squid Information', infoDiv));

        // Neuron Values
        const neuronDiv = document.createElement('div');
        const keys = ['hunger', 'happiness', 'cleanliness', 'sleepiness', 'satisfaction', 'anxiety', 'curiosity', 'health'];
        keys.forEach(k => {
            if (squidData[k] !== undefined) {
                neuronDiv.appendChild(createNeuronRow(k, squidData[k]));
            }
        });
        container.appendChild(createCollapsible('🧠 Core Neuron Values', neuronDiv));

        // Neurogenesis
        const brain = saveData.brain_state || {};
        const enhanced = brain.enhanced_neurogenesis || {};
        const funcNeurons = enhanced.functional_neurons || {};
        
        const neuroDiv = document.createElement('div');
        neuroDiv.appendChild(createKVRow('Total Neurogenesis Neurons', Object.keys(funcNeurons).length));
        neuroDiv.appendChild(createKVRow('Novelty Neurons', enhanced.novelty_neuron_count || 0));
        
        if (Object.keys(funcNeurons).length > 0) {
            const list = document.createElement('div');
            list.style.marginTop = '10px';
            for (const [name, data] of Object.entries(funcNeurons)) {
                const item = document.createElement('div');
                item.style.padding = '5px 0';
                item.style.borderTop = '1px solid #333';
                item.innerHTML = `<span style="color:#4CAF50">🧬 ${name}</span> (${data.neuron_type}) - Util: ${data.utility_score?.toFixed(2)}`;
                list.appendChild(item);
            }
            neuroDiv.appendChild(list);
        }
        
        container.appendChild(createCollapsible('🧬 Neurogenesis', neuroDiv));

        // Stats (v2)
        if (Object.keys(stats).length > 0) {
            const statsDiv = document.createElement('div');
            
            const groups = {
                "Food & Consumption": ['cheese_eaten', 'sushi_eaten', 'poops_created'],
                "Interactions": ['startles_experienced', 'ink_clouds_created', 'rocks_thrown'],
                "Neural Development": ['current_neurons', 'max_neurons_reached', 'novelty_neurons_created']
            };

            for (const [group, fields] of Object.entries(groups)) {
                const title = document.createElement('div');
                title.className = 'stat-group-title';
                title.textContent = group;
                statsDiv.appendChild(title);
                
                fields.forEach(f => {
                    if (stats[f] !== undefined) {
                        statsDiv.appendChild(createKVRow(f.replace(/_/g, ' '), stats[f]));
                    }
                });
            }
            container.appendChild(createCollapsible('📊 Statistics', statsDiv));
        }

        return container;
    }

    // 2. Network Renderer (Canvas)
    function renderNetwork() {
        const container = document.createElement('div');
        container.style.height = '100%';
        container.style.display = 'flex';
        container.style.flexDirection = 'column';

        const canvas = document.createElement('canvas');
        canvas.id = 'network-canvas';
        // Size will be set dynamically, but initial size:
        canvas.width = 1000;
        canvas.height = 700;
        canvas.style.width = '100%';
        canvas.style.height = 'auto';
        canvas.style.maxWidth = '1000px';

        container.appendChild(canvas);

        const brain = saveData.brain_state || {};
        const positions = brain.neuron_positions || {};
        const weightsList = brain.weights_list || [];
        const states = brain.neuron_states || brain.state || {};

        // Convert weights list to helpful structure
        const weights = [];
        weightsList.forEach(w => {
            if (Array.isArray(w) && w.length === 3) {
                weights.push({ src: w[0], dst: w[1], weight: w[2] });
            }
        });

        // Ensure positions exist if missing
        if (Object.keys(positions).length === 0) {
            const keys = Object.keys(states);
            keys.forEach((k, i) => {
                positions[k] = [100 + (i % 5) * 150, 100 + Math.floor(i / 5) * 150];
            });
        }

        // Draw function
        setTimeout(() => {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Background
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Scale to fit
            // Find bounds
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (const key in positions) {
                const [x, y] = positions[key];
                minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                minY = Math.min(minY, y); maxY = Math.max(maxY, y);
            }
            
            // Add padding
            const padding = 50;
            const dataWidth = maxX - minX + padding * 2;
            const dataHeight = maxY - minY + padding * 2;
            
            // Calculate scale
            const scaleX = canvas.width / dataWidth;
            const scaleY = canvas.height / dataHeight;
            const scale = Math.min(scaleX, scaleY, 1.2); // cap scale
            
            const offsetX = (canvas.width - dataWidth * scale) / 2 - minX * scale + padding * scale;
            const offsetY = (canvas.height - dataHeight * scale) / 2 - minY * scale + padding * scale;

            // Draw Connections
            weights.forEach(w => {
                const p1 = positions[w.src];
                const p2 = positions[w.dst];
                if (!p1 || !p2) return;

                const x1 = p1[0] * scale + offsetX;
                const y1 = p1[1] * scale + offsetY;
                const x2 = p2[0] * scale + offsetX;
                const y2 = p2[1] * scale + offsetY;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                
                // Color based on weight (Green +, Red -)
                const intensity = Math.min(Math.abs(w.weight), 1.0);
                if (w.weight > 0) {
                    ctx.strokeStyle = `rgba(0, ${Math.floor(255 * intensity)}, 0, 0.6)`;
                } else {
                    ctx.strokeStyle = `rgba(${Math.floor(255 * intensity)}, 0, 0, 0.6)`;
                }
                
                ctx.lineWidth = Math.max(1, 2 * intensity + 0.5);
                if (w.weight < 0 && Math.abs(w.weight) < 0.3) {
                    ctx.setLineDash([5, 5]);
                } else {
                    ctx.setLineDash([]);
                }
                ctx.stroke();

                // Draw weight label for strong connections
                if (Math.abs(w.weight) > 0.1) {
                    const mx = (x1 + x2) / 2;
                    const my = (y1 + y2) / 2;
                    ctx.fillStyle = 'rgba(30, 30, 30, 0.8)';
                    ctx.fillRect(mx - 15, my - 8, 30, 16);
                    ctx.fillStyle = '#ccc';
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(w.weight.toFixed(2), mx, my + 4);
                }
            });

            // Draw Neurons
            for (const name in positions) {
                const [rawX, rawY] = positions[name];
                const x = rawX * scale + offsetX;
                const y = rawY * scale + offsetY;
                const val = states[name] || 0;

                // Color based on value (Green > Yellow > Red)
                let fill = '#999';
                if (typeof val === 'number') {
                    const norm = Math.max(0, Math.min(1, val / 100));
                    if (norm > 0.7) fill = '#4CAF50';
                    else if (norm > 0.4) fill = '#FFC107';
                    else fill = '#F44336';
                }

                ctx.beginPath();
                ctx.arc(x, y, 15, 0, Math.PI * 2);
                ctx.fillStyle = fill;
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Label
                ctx.fillStyle = '#e0e0e0';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                const displayName = name.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                
                // Text background
                const textWidth = ctx.measureText(displayName).width;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(x - textWidth/2 - 4, y + 20, textWidth + 8, 16);
                
                ctx.fillStyle = '#fff';
                ctx.fillText(displayName, x, y + 32);
            }

        }, 100);

        return container;
    }

    // 3. Render Human Readable JSON (Memories, Achievements)
    function renderJsonView(key, data, isHumanReadable) {
        const container = document.createElement('div');

        if (key === 'ShortTerm' || key === 'LongTerm') {
            if (!Array.isArray(data) || data.length === 0) {
                container.textContent = "No memories found.";
                return container;
            }
            
            data.forEach(mem => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                
                const header = document.createElement('div');
                header.style.display = 'flex';
                header.style.justifyContent = 'space-between';
                header.style.marginBottom = '5px';

                const left = document.createElement('div');
                const tag = document.createElement('span');
                tag.className = `tag ${mem.category || ''}`;
                tag.textContent = mem.category || 'UNK';
                left.appendChild(tag);
                
                const title = document.createElement('span');
                title.style.fontWeight = 'bold';
                title.style.color = '#7fbadc';
                title.textContent = (mem.key || 'Unknown').replace(/_/g, ' ');
                left.appendChild(title);
                
                header.appendChild(left);
                
                if (mem.importance) {
                    const imp = document.createElement('span');
                    imp.style.color = '#FFD700';
                    imp.textContent = `★ ${mem.importance}`;
                    header.appendChild(imp);
                }

                card.appendChild(header);

                const val = document.createElement('div');
                val.textContent = mem.value;
                val.style.marginBottom = '5px';
                card.appendChild(val);

                const meta = document.createElement('div');
                meta.style.fontSize = '0.8em';
                meta.style.color = '#666';
                const date = mem.timestamp > 1000000000 ? new Date(mem.timestamp * 1000).toLocaleString() : 'Unknown';
                meta.textContent = `🕐 ${date}`;
                card.appendChild(meta);

                container.appendChild(card);
            });
        } else if (key === 'achievements') {
            const unlocked = data.unlocked || {};
            const list = document.createElement('div');
            
            const title = document.createElement('h3');
            title.textContent = `Unlocked (${Object.keys(unlocked).length})`;
            title.style.color = '#e0e0e0';
            list.appendChild(title);

            for(const k in unlocked) {
                const item = document.createElement('div');
                item.style.padding = '5px';
                item.textContent = `🏆 ${k.replace(/_/g, ' ').toUpperCase()}`;
                list.appendChild(item);
            }
            container.appendChild(list);

            const progDiv = document.createElement('div');
            progDiv.style.marginTop = '20px';
            const progTitle = document.createElement('h3');
            progTitle.textContent = "Progress";
            progTitle.style.color = '#e0e0e0';
            progDiv.appendChild(progTitle);

            const progress = data.progress || {};
            for(const k in progress) {
                progDiv.appendChild(createKVRow(k.replace(/_/g, ' '), progress[k]));
            }
            container.appendChild(progDiv);

        } else {
            // Default to Tree for game_state etc if passed here, 
            // but usually we use specific human-readable parsers in Python.
            // For JS simplicity, fallback to Tree if not memory/achievement
            if (key === 'game_state' || key === 'brain_state' || key === 'statistics') {
                // We actually handled these in Overview mostly.
                // Let's just show the raw JSON tree for full detail access.
                return renderJsonTree(data);
            }
        }

        return container;
    }

    // 4. Generic JSON Tree Renderer
    function formatAge(seconds) {
        if (!seconds) return "0s";
        const d = Math.floor(seconds / 86400);
        const h = Math.floor((seconds % 86400) / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        return `${d}d ${h}h ${m}m ${s}s`.replace(/^0d /, '').replace(/^0h /, '');
    }

    function renderJsonTree(data) {
        const container = document.createElement('div');
        container.className = 'json-tree';
        
        function createNode(key, value) {
            const li = document.createElement('li');
            
            if (typeof value === 'object' && value !== null) {
                const isArray = Array.isArray(value);
                const isEmpty = Object.keys(value).length === 0;
                
                const span = document.createElement('span');
                if (!isEmpty) {
                    span.className = 'caret caret-right';
                    span.onclick = function() {
                        this.classList.toggle('caret-down');
                        this.classList.toggle('caret-right');
                        this.parentElement.querySelector('.nested').classList.toggle('active');
                    };
                } else {
                    span.className = 'caret'; // No arrow
                    span.innerHTML = '&nbsp;';
                }
                
                li.appendChild(span);
                
                const keySpan = document.createElement('span');
                keySpan.className = 'key';
                keySpan.textContent = key ? `${key}: ` : '';
                li.appendChild(keySpan);

                const typeSpan = document.createElement('span');
                typeSpan.style.color = '#888';
                typeSpan.textContent = isArray ? `[${value.length}]` : `{${Object.keys(value).length}}`;
                li.appendChild(typeSpan);

                if (!isEmpty) {
                    const ul = document.createElement('ul');
                    ul.className = 'nested';
                    for (const k in value) {
                        ul.appendChild(createNode(k, value[k]));
                    }
                    li.appendChild(ul);
                }
            } else {
                const span = document.createElement('span');
                span.className = 'caret';
                span.innerHTML = '&nbsp;';
                li.appendChild(span);

                const keySpan = document.createElement('span');
                keySpan.className = 'key';
                keySpan.textContent = key ? `${key}: ` : '';
                li.appendChild(keySpan);

                const valSpan = document.createElement('span');
                if (typeof value === 'string') {
                    valSpan.className = 'string';
                    valSpan.textContent = `"${value}"`;
                } else if (typeof value === 'number') {
                    valSpan.className = 'number';
                    valSpan.textContent = value;
                } else if (typeof value === 'boolean') {
                    valSpan.className = 'boolean';
                    valSpan.textContent = value;
                } else {
                    valSpan.className = 'null';
                    valSpan.textContent = 'null';
                }
                li.appendChild(valSpan);
            }
            return li;
        }

        const ul = document.createElement('ul');
        ul.style.paddingLeft = '0';
        // Root nodes
        if (Array.isArray(data)) {
            data.forEach((item, index) => ul.appendChild(createNode(index, item)));
        } else {
            for (const key in data) {
                ul.appendChild(createNode(key, data[key]));
            }
        }
        
        container.appendChild(ul);
        return container;
    }
