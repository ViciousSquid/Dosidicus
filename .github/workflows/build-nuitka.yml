name: Build (Nuitka)

on:
  workflow_dispatch:

jobs:
  build:

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka pyqt5 numpy

    - name: Build executable
      run: |
        # Windows-only flags (icon)
        EXTRA_FLAGS=""
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          EXTRA_FLAGS="--windows-icon-from-ico=images/icons/squidblack.ico"
        fi

        python -m nuitka \
          --standalone \
          --assume-yes-for-downloads \
          --output-dir=build \
          --output-filename=Dosidicus \
          --include-module=plugins.achievements.display_scaling \
          --include-module=plugins.achievements.achievements_data \
          --include-module=uuid \
          --include-module=brain_designer \
          --include-module=designer_window \
          --include-module=designer_core \
          --include-module=designer_constants \
          --include-module=designer_logging \
          --include-module=designer_dialogs \
          --include-module=brain_state_bridge \
          $EXTRA_FLAGS \
          main.py

    - name: Create release directory
      run: |
        mkdir release

    - name: Copy repository structure
      run: |
        for item in *; do
          case "$item" in
            release|dist|build|__pycache__) ;;
            *) cp -r "$item" release/ 2>/dev/null || true ;;
          esac
        done

    - name: Remove python entrypoint
      run: |
        rm -f release/main.py || true

    - name: Insert compiled executable
      run: |
        cp -r build/main.dist/* release/

    - name: Create zip
      run: |
        python -c "import shutil; shutil.make_archive('app-nuitka-${{ runner.os }}', 'zip', 'release')"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuitka-${{ runner.os }}
        path: app-nuitka-${{ runner.os }}.zip
