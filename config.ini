[Hebbian]
# Seconds between plasticity commits. Co-activation is accumulated every tick,
# so this is a pacing choice, not a correctness one.
learning_interval = 20

# Applied to the CORRELATION between the two neurons over the window, not to
# an instantaneous product. Setting this equal to weight_decay makes a synapse
# converge to exactly that correlation, so every weight in the network reads
# as a statement about the squid's experience.
base_learning_rate = 0.04

# Sets the time constant: tau = 1/decay = 25 commits, so a synapse settles
# over roughly 8 minutes of play. Keep equal to base_learning_rate.
weight_decay = 0.04

# Weights are SIGNED. Anti-correlated neurons develop inhibitory synapses,
# which is what an avoidance behaviour ("afraid of poop") actually is.
min_weight = -1.0
max_weight = 1.0

# Floor on pairs committed per cycle
max_hebbian_pairs = 4

# Blend between rules: 0.0 = pure Hebbian, 1.0 = pure spike timing.
stdp_weight = 0.4

