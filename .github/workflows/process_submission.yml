name: Squid Exchange Submission

on:
  issues:
    types: [opened]

jobs:
  process-submission:
    if: contains(github.event.issue.labels.*.name, 'squid-submission')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract submission information
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          FILE_URL=$(echo "$ISSUE_BODY" | grep -o 'https://github.com/[^)]*' | head -n 1)

          NICKNAME=$(echo "$ISSUE_BODY" \
            | grep -A 1 "Squid Nickname" \
            | tail -n 1 \
            | xargs \
            | tr -d ' ')

          if [ -z "$FILE_URL" ]; then
            echo "No GitHub file URL found."
            exit 1
          fi

          if [ -z "$NICKNAME" ]; then
            echo "No squid nickname found."
            exit 1
          fi

          echo "FILE_URL=$FILE_URL" >> "$GITHUB_ENV"
          echo "NICKNAME=$NICKNAME" >> "$GITHUB_ENV"

      - name: Download squid
        run: |
          curl -L "$FILE_URL" -o temp_squid.zip

          if ! file temp_squid.zip | grep -qi "zip"; then
            echo "Downloaded file is not a ZIP archive."
            exit 1
          fi

      - name: Validate Dosidicus save
        run: |
          python - <<'PY'
          import zipfile
          import sys

          required = {
              "game_state.json",
              "brain_state.json",
              "ShortTerm.json",
              "LongTerm.json",
              "plugin_data.json",
              "statistics.json",
              "uuid.txt",
          }

          try:
              with zipfile.ZipFile("temp_squid.zip", "r") as z:
                  missing = required - set(z.namelist())

                  if missing:
                      print("Missing required files:")

                      for name in sorted(missing):
                          print(f"  - {name}")

                      sys.exit(1)

                  if z.testzip() is not None:
                      print("ZIP contains corrupt data.")
                      sys.exit(1)

          except zipfile.BadZipFile:
              print("Invalid ZIP archive.")
              sys.exit(1)

          print("Dosidicus save validated.")
          PY

      - name: Extract neural statistics
        run: |
          python scripts/extract_metadata.py temp_squid.zip \
            > neural_statistics.json

          cat neural_statistics.json

      - name: Extract UUID
        run: |
          UUID=$(unzip -p temp_squid.zip uuid.txt | head -n 1 | xargs)

          if [ -z "$UUID" ]; then
            echo "UUID is empty."
            exit 1
          fi

          echo "UUID=$UUID" >> "$GITHUB_ENV"

      - name: Create specimen
        run: |
          SPECIMEN_DIR="squids/$NICKNAME"

          if [ -e "$SPECIMEN_DIR" ]; then
            echo "A specimen named '$NICKNAME' already exists."
            exit 1
          fi

          mkdir -p "$SPECIMEN_DIR"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          specimen_dir = (
              Path("squids")
              / os.environ["NICKNAME"]
          )

          statistics = json.loads(
              Path("neural_statistics.json").read_text(
                  encoding="utf-8"
              )
          )

          name = os.environ["NICKNAME"]
          specimen_id = (
              "dosidicus-"
              + os.environ["UUID"]
          )

          raised_by = (
              "@"
              + os.environ.get(
                  "GITHUB_ACTOR",
                  "unknown"
              )
          )

          neuron_count = statistics.get(
              "neuron_count",
              0
          )

          neurons_generated = statistics.get(
              "neurons_generated",
              0
          )

          connection_count = statistics.get(
              "connection_count",
              0
          )

          metadata = {
              "name": name,
              "specimen_id": specimen_id,
              "description": "",
              "raised_by": raised_by,
              "parent_id": None,
              "generation": 1,
              "neuron_count": neuron_count,
              "neurons_generated": neurons_generated,
              "connection_count": connection_count
          }

          (
              specimen_dir
              / "metadata.json"
          ).write_text(
              json.dumps(
                  metadata,
                  indent=4
              ) + "\n",
              encoding="utf-8"
          )

          template = Path(
              "templates/README.md"
          ).read_text(
              encoding="utf-8"
          )

          replacements = {
              "{{NAME}}": name,
              "{{SPECIMEN_ID}}": specimen_id,
              "{{RAISED_BY}}": raised_by,
              "{{DESCRIPTION}}": (
                  "Dosidicus specimen submitted "
                  "to the Squid Exchange."
              ),
              "{{GENERATION}}": "1",
              "{{NEURON_COUNT}}": str(
                  neuron_count
              ),
              "{{NEURONS_GENERATED}}": str(
                  neurons_generated
              ),
              "{{CONNECTION_COUNT}}": str(
                  connection_count
              )
          }

          for placeholder, value in replacements.items():
              template = template.replace(
                  placeholder,
                  value
              )

          (
              specimen_dir
              / "README.md"
          ).write_text(
              template,
              encoding="utf-8"
          )
          PY

          mv temp_squid.zip \
            "$SPECIMEN_DIR/${NICKNAME}_${UUID}.zip"

      - name: Update catalogue
        run: |
          python scripts/build_catalogue.py

      - name: Commit Exchange specimen
        run: |
          git config user.name "SquidBot"
          git config user.email "bot@github.com"

          git add squids/ README.md

          git commit \
            -m "Add Squid Exchange specimen: ${NICKNAME}"

          git push

      - name: Report success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          STATS=$(cat neural_statistics.json)

          gh issue comment "$ISSUE_NUMBER" --body \
            "## 🦑 Squid accepted

          **Name:** $NICKNAME

          **UUID:** \`$UUID\`

          **Neural statistics:**

          \`\`\`json
          $STATS
          \`\`\`

          The specimen has been added to the Squid Exchange."

          gh issue close "$ISSUE_NUMBER"
