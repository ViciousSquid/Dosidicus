name: Build (PyInstaller)

on:
  workflow_dispatch:

jobs:
  build:

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyqt5 numpy

    - name: Build executable
      run: |
        pyinstaller \
          --onedir \
          --clean \
          --noconfirm \
          --name Dosidicus \
          --icon images/icons/squidblack.ico \
          --collect-submodules src \
          --hidden-import plugins.achievements.display_scaling \
          --hidden-import plugins.achievements.achievements_data \
          --hidden-import uuid \
          --hidden-import brain_designer \
          --hidden-import designer_window \
          --hidden-import designer_core \
          --hidden-import designer_constants \
          --hidden-import designer_logging \
          --hidden-import designer_dialogs \
          --hidden-import brain_state_bridge \
          main.py

    - name: Create release directory
      run: |
        mkdir release

    - name: Copy repository structure
      run: |
        for item in *; do
          case "$item" in
            release|dist|build|__pycache__) ;;
            *) cp -r "$item" release/ 2>/dev/null || true ;;
          esac
        done

    - name: Remove python entrypoint
      run: |
        rm -f release/main.py || true

    - name: Insert compiled executable
      run: |
        cp -r dist/Dosidicus/* release/

    - name: Create zip
      run: |
        OS_NAME=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
        python -c "import shutil; shutil.make_archive('Dosidicus${{ github.ref_name }}-${OS_NAME}', 'zip', 'release')"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pyinstaller-${{ runner.os }}
        path: Dosidicus${{ github.ref_name }}-*.zip
