name: Newborn weight-space experiment
on:
  push:
    branches: [experiment/newborn-weight-space-2026-11]
    paths:
      - 'src/brain_constants.py'
      - 'src/propagation.py'
      - 'src/portable_brain.py'
      - 'headless/headless_trainer.py'
      - 'experiments/weight_space/experiment.py'
      - 'experiments/weight_space/grid_scan.py'
      - 'experiments/weight_space/closed_loop.py'
      - 'experiments/weight_space/trainer_transfer.py'
      - 'tests/test_weight_space_experiment.py'
      - 'tests/test_weight_space_closed_loop.py'
      - 'tests/test_headless_causal_training.py'
      - 'tests/test_headless_trainer_transfer.py'
      - '.github/workflows/weight-space-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-neural-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment commit
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install numpy pytest PyQt5 Pillow platformdirs
      - name: Existing mechanism suite plus experiment tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q tests/test_headless_training.py tests/test_weight_space_experiment.py tests/test_weight_space_closed_loop.py tests/test_headless_causal_training.py tests/test_headless_trainer_transfer.py
      - name: Full paired A/B report
        run: python -m experiments.weight_space.experiment --json experiments/weight_space/results.json
      - name: Descriptive 144-state robustness sweep
        run: python -m experiments.weight_space.grid_scan --json experiments/weight_space/grid_results.json
      - name: Action-coupled lifelong training and transfer experiment
        run: python -m experiments.weight_space.closed_loop --json experiments/weight_space/closed_loop_results.json
      - name: Native trainer learning-transfer comparison
        run: python -m experiments.weight_space.trainer_transfer --json experiments/weight_space/trainer_transfer_results.json
      - name: Upload complete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newborn-weight-space-report
          path: |
            experiments/weight_space/results.json
            experiments/weight_space/grid_results.json
            experiments/weight_space/closed_loop_results.json
            experiments/weight_space/trainer_transfer_results.json
          if-no-files-found: warn
