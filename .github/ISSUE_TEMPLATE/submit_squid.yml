name: Submit a Squid Save
description: Submit your evolved Dosidicus squid
labels: squid-submission
body:
  - type: markdown
    attributes:
      value: |
        IMPORTANT: Enter your squid's name in the Add a title field above.

        The issue title becomes the squid's name in the Squid Exchange.

        To upload your save:
        1. Write a comment on this issue.
        2. Drag your Dosidicus ZIP into the comment box.
        3. GitHub will upload the ZIP and create a link.
        4. Copy that link.
        5. Paste the link into Save File URL below.

  - type: input
    id: save_url
    attributes:
      label: Save File URL
      description: Paste the GitHub attachment URL for your Dosidicus ZIP here.
      placeholder: Paste ZIP URL here
    validations:
      required: true
