name: 🦑 Submit a Squid Save
description: IMPORTANT - Enter your squid's name in the "Add a title" field. The issue title becomes the squid's name.
labels:

* squid-submission

body:

* type: markdown
  attributes:
  value: |
  ## 🦑 Submit Your Squid

  ```
  **IMPORTANT: The issue title must be your squid's name.**

  For example, enter `Horatio` in the **Add a title** field.

  The issue title will become the squid's name in the Squid Exchange.

  ### Save File

  Upload your Dosidicus `.zip` in the issue's **comment box**.

  GitHub will upload the file and create a link.

  Copy that link and paste it into the field below.
  ```

* type: input
  id: save_url
  attributes:
  label: Save File URL
  description: Paste the GitHub attachment URL for your Dosidicus ZIP here.
  placeholder: https://github.com/user-attachments/files/...
  validations:
  required: true
